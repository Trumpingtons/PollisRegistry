# The vignettes of the packages in this registry, one table per package, written by Pollis
# (Compose > New Methods > Package and Publish) and shown in Help > Documentation > Vignettes.

[ArcFS]
author = "Antonio Saragga Seabra"
citation = "Breiman, L. (1998). Arcing classifiers. The Annals of Statistics 26(3), 801-849."
description = "Breiman's arc-fs, the AdaBoost of his random forests paper: adaptive resampling with CART trees pruned by cost complexity on a second draw, voting with weights, tested on his published test errors for 20 data sets."
method = "arc-fs: adaptive resampling with pruned trees"
package = "ArcFS"
pdf = "https://github.com/Trumpingtons/ArcFS.jl/blob/main/vignette/ArcFS.pdf"
repository = "https://github.com/Trumpingtons/ArcFS.jl"
title = "arc-fs: adaptive resampling with pruned trees"
version = "0.1.0"

[BreslowCox]
author = "Antonio Saragga Seabra"
citation = "Dickson, E. R., Grambsch, P. M., Fleming, T. R., Fisher, L. D. and Langworthy, A. (1989). Prognosis in primary biliary cirrhosis: model for decision making. Hepatology 10(1), 1-7."
description = "The Cox proportional hazards model fitted on Breslow's partial likelihood, as SAS PHGLM did, with Wald and likelihood ratio tests, and Kalbfleisch and Prentice's predicted survival, tested on the Mayo model of primary biliary cirrhosis."
method = "The Cox model with Breslow's ties, and its predicted survival"
package = "BreslowCox"
pdf = "https://github.com/Trumpingtons/BreslowCox.jl/blob/main/vignette/BreslowCox.pdf"
repository = "https://github.com/Trumpingtons/BreslowCox.jl"
title = "The Cox model with Breslow's ties, and its predicted survival"
version = "0.1.0"

[LSTNet]
author = "Antonio Saragga Seabra"
citation = "Lai, G., Chang, W.-C., Yang, Y. and Liu, H. (2018). Modeling long- and short-term temporal patterns with deep neural networks. In SIGIR '18: The 41st International ACM SIGIR Conference on Research and Development in Information Retrieval, 95-104."
description = "Multivariate time series forecasting with LSTNet-Skip (Lai, Chang, Yang and Liu 2018): a convolution, a GRU, a recurrent-skip GRU and an autoregressive highway, translated from the authors' PyTorch code into Lux and tested against it, on any GPU or the CPU; with the evaluation of the article: the 60/20/20 split, the RSE and CORR at horizons 3, 6, 12 and 24."
method = "LSTNet: long- and short-term patterns in multivariate time series"
package = "LSTNet"
pdf = "https://github.com/Trumpingtons/LSTNet.jl/blob/main/vignette/LSTNet.pdf"
repository = "https://github.com/Trumpingtons/LSTNet.jl"
title = "LSTNet: long- and short-term patterns in multivariate time series"
version = "0.1.0"
